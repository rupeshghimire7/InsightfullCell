[project]
name = "insightfulcell-backend"
version = "0.3.0"
description = "InsightfulCell API: identity verification, tenancy, uploads and file ingestion."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.1",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.14",
  "boto3>=1.35",
  "PyJWT[crypto]>=2.9",
  "duckdb>=1.1",
  "openpyxl>=3.1",
  "procrastinate==3.10.0",
  "anthropic>=1.13.0",
  "openai>=3.27.0",
  "google-genai>=2.29.0",
  "httpx>=0.28",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.27",
  "moto[server,s3]>=5.0",
  "mypy>=1.13",
  "ruff>=0.8",
  "import-linter>=2.1",
  "pip-audit>=2.7",
  "boto3-stubs[s3]>=1.35",
  "types-openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightfulcell"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "A",        # builtins shadowing
  "C4",       # comprehensions
  "SIM",      # simplifications
  "S",        # bandit (security)
  "ASYNC",    # async pitfalls
  "PT",       # pytest style
  "RUF",      # ruff-specific
  "TID",      # tidy imports
  "T20",      # no print() in library code
  "PL",       # pylint subset
  "ANN",      # annotations
  "DTZ",      # naive datetimes
  "EM",       # error-message literals
  "TRY",      # exception handling
]
ignore = [
  "PLR2004",  # magic values: constants are named where they carry meaning
  "TRY003",   # long messages in exception classes are fine for domain errors
  "EM101", "EM102",
  "ANN401",   # Any is allowed only at third-party boundaries (reviewed)
  "N818",     # domain errors read better without an Error suffix (Forbidden, ParseFailure)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN", "PLR0913", "PLR0917", "S608"]
"migrations/**" = ["S608", "E501"]
"src/insightfulcell/ingestion/__main__.py" = ["T201"]
# The engine writes DuckDB SQL by design. Every identifier and literal goes through
# engine/sql.py (ident, literal, number); values that vary per call are bound parameters.
"src/insightfulcell/engine/**" = ["S608"]
# The planning prompt is text for a model, not code: its lines are as long as its sentences.
"src/insightfulcell/engine/planning/prompt.py" = ["E501"]
# The recipe is a template of another program; its lines are that program's lines.
"src/insightfulcell/engine/recipe.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["insightfulcell"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "migrations"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["moto.*", "duckdb.*", "alembic.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs Postgres (TEST_DATABASE_ADMIN_URL) and a local S3 emulator",
  "tenancy: cross-tenant isolation suite; must run as a non-owner, NOBYPASSRLS role",
]
filterwarnings = ["error", "ignore::DeprecationWarning:moto.*", "ignore::DeprecationWarning:botocore.*"]

# --------------------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["src/insightfulcell"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# --------------------------------------------------------------------------- import-linter
# ADR-003: module boundaries are enforced, not just agreed.
[tool.importlinter]
root_package = "insightfulcell"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Pure layers do not depend on frameworks or infrastructure"
type = "forbidden"
source_modules = [
  "insightfulcell.domain",
  "insightfulcell.ingestion",
  "insightfulcell.engine",
  "insightfulcell.pipeline",
]
forbidden_modules = [
  "insightfulcell.api",
  "insightfulcell.worker",
  "insightfulcell.db",
  "insightfulcell.storage",
  "insightfulcell.queue",
  "insightfulcell.services",
  "insightfulcell.auth",
  "insightfulcell.llm",
  "fastapi",
  "sqlalchemy",
  "boto3",
  "psycopg",
  "procrastinate",
  "httpx",
  "anthropic",
  "openai",
  "google",
]

[[tool.importlinter.contracts]]
name = "Only the LLM gateway's provider adapters import model SDKs (ADR-031)"
type = "forbidden"
source_modules = [
  "insightfulcell.api",
  "insightfulcell.services",
  "insightfulcell.db",
  "insightfulcell.storage",
  "insightfulcell.auth",
  "insightfulcell.queue",
  "insightfulcell.worker",
  "insightfulcell.llm.gateway",
  "insightfulcell.llm.breaker",
  "insightfulcell.llm.pricing",
]
forbidden_modules = ["anthropic", "openai", "google"]
# The worker's composition root builds the configured adapter; it never calls an SDK itself.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only the queue adapter and the worker import Procrastinate (ADR-030)"
type = "forbidden"
source_modules = [
  "insightfulcell.api",
  "insightfulcell.services",
  "insightfulcell.db",
  "insightfulcell.storage",
  "insightfulcell.auth",
]
forbidden_modules = ["procrastinate"]
# The API's composition root may build the adapter; it must not use Procrastinate itself.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Services depend on ports, never on adapters"
type = "forbidden"
source_modules = ["insightfulcell.services"]
forbidden_modules = [
  "insightfulcell.queue.procrastinate_queue",
  "insightfulcell.storage.s3",
  "insightfulcell.llm.providers",
]

[[tool.importlinter.contracts]]
name = "The API and the worker are separate entry points"
type = "independence"
modules = ["insightfulcell.api", "insightfulcell.worker"]

[[tool.importlinter.contracts]]
name = "Layering: (api | worker) -> services -> (db, storage, auth, queue) -> domain"
type = "layers"
layers = [
  "insightfulcell.api | insightfulcell.worker",
  "insightfulcell.services",
  "insightfulcell.db | insightfulcell.storage | insightfulcell.auth | insightfulcell.queue | insightfulcell.llm",
  "insightfulcell.domain",
]
